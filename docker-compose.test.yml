name: ai-cfo-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cfo_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cfo_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-test:
    build:
      context: ./cfo-backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cfo_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cfo_test
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: test_secret_key_for_ci
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      OPENROUTER_API_KEY: ""
      OPENROUTER_MODEL: google/gemini-2.5-flash
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      ENCRYPTION_KEY: test_encryption_key_for_ci_only!!
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_BOT_USERNAME: ""
      TELEGRAM_WEBHOOK_SECRET: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: >
      sh -c "alembic upgrade head && python -m pytest tests/ -v --tb=short -x"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys; sys.exit(0)'"]
      interval: 5s
      timeout: 5s
      retries: 2
