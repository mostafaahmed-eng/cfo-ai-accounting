events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Lets upstream `server ... resolve` re-resolve the
    # backend/frontend hostnames when those containers are recreated (new IPs),
    # instead of caching the first-resolved address until nginx restarts.
    resolver 127.0.0.11 valid=30s ipv6=off;

    upstream frontend {
        zone frontend 64k;
        server frontend:3000 resolve;
    }

    upstream backend {
        zone backend 64k;
        server backend:8000 resolve;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # For HTTPS, use nginx/nginx.ssl.conf instead (see docker-compose.prod.yml:
    # NGINX_CONF_FILE=./nginx/nginx.ssl.conf + NGINX_CERT_DIR). It adds TLS and an
    # HTTP -> HTTPS redirect while keeping /health on plain HTTP for Docker checks.

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # API routes
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;

            # SSE / streaming support
            proxy_buffering off;
            proxy_cache off;
        }

        # Health check
        location /health {
            proxy_pass http://backend/health;
        }

        # Next.js HMR (dev only)
        location /_next/webpack-hmr {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Frontend (all other routes)
        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
