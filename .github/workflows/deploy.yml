name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: read

jobs:
  deploy-staging:
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.HAS_STAGING_SSH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.cfo-manager.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy to staging server
        env:
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          SSH_USER: ${{ secrets.STAGING_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} bash -s << 'DEPLOY_EOF'
            set -euo pipefail
            cd /opt/cfo-manager

            export TAG=main
            echo "Deploying with TAG=${TAG}"

            git pull origin main

            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml up -d postgres redis
            sleep 5

            docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head

            docker compose -f docker-compose.prod.yml up -d

            # Backend/frontend publish no host ports; check health inside the
            # compose network via docker compose exec.
            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T backend curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "Backend is healthy"
                break
              fi
              echo "Waiting for backend... ($i/30)"
              sleep 2
              if [ "$i" -eq 30 ]; then
                docker compose -f docker-compose.prod.yml ps
                echo "ERROR: backend health check failed" >&2
                exit 1
              fi
            done

            # Force nginx to re-resolve upstream hostnames after service recreate.
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload > /dev/null 2>&1 || \
              echo "WARNING: nginx reload failed; stale upstream DNS may persist until restart"

            docker compose -f docker-compose.prod.yml ps
            bash scripts/health-check.sh
          DEPLOY_EOF

      - name: Notify deployment
        if: success()
        run: echo "Staging deployment successful at $(date)"

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v') && vars.HAS_PRODUCTION_SSH == 'true'
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://cfo-manager.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Pre-deployment backup
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} bash -s << 'BACKUP_EOF'
            set -euo pipefail
            mkdir -p /opt/backups
            cd /opt/cfo-manager
            BACKUP_NAME="backup_$(date +%Y%m%d_%H%M%S)"
            docker compose -f docker-compose.prod.yml exec -T postgres pg_dump -U postgres cfo_db | gzip > /opt/backups/${BACKUP_NAME}.sql.gz
            echo "Backup created: ${BACKUP_NAME}"
          BACKUP_EOF

      - name: Deploy to production
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_TAG: ${{ github.ref_name }}
        run: |
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} bash -s << DEPLOY_EOF
            set -euo pipefail
            cd /opt/cfo-manager

            export TAG=$(echo "${DEPLOY_TAG}" | sed 's/^v//')
            echo "Deploying with TAG=\${TAG}"

            git fetch --tags
            git checkout \$(git describe --tags --abbrev=0)

            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml up -d postgres redis
            sleep 5

            docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head

            docker compose -f docker-compose.prod.yml up -d

            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T backend curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "Backend is healthy"
                break
              fi
              echo "Waiting for backend... ($i/30)"
              sleep 2
              if [ "$i" -eq 30 ]; then
                docker compose -f docker-compose.prod.yml ps
                echo "ERROR: backend health check failed" >&2
                exit 1
              fi
            done

            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload > /dev/null 2>&1 || \
              echo "WARNING: nginx reload failed; stale upstream DNS may persist until restart"

            docker compose -f docker-compose.prod.yml ps
            bash scripts/health-check.sh
          DEPLOY_EOF

      - name: Post-deployment verification
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} bash -s << 'VERIFY_EOF'
            echo "=== Service Status ==="
            cd /opt/cfo-manager
            docker compose -f docker-compose.prod.yml ps

            echo "=== Health Check ==="
            docker compose -f docker-compose.prod.yml exec -T backend curl -sf http://localhost:8000/health
            echo ""

            echo "=== Recent Logs ==="
            docker compose -f docker-compose.prod.yml logs --tail=20 backend
          VERIFY_EOF

      - name: Rollback on failure
        if: failure()
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} bash -s << 'ROLLBACK_EOF'
            set -euo pipefail
            cd /opt/cfo-manager
            echo "Rolling back to previous tag..."

            PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
            if [ -z "$PREV_TAG" ]; then
              echo "ERROR: No previous tag found to roll back to"
              exit 1
            fi
            git checkout "$PREV_TAG"

            export TAG=$(echo "$PREV_TAG" | sed 's/^v//')
            echo "Rolling back to TAG=${TAG}"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d postgres redis
            docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head
            docker compose -f docker-compose.prod.yml up -d

            sleep 10
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml exec -T backend curl -sf http://localhost:8000/health || exit 1
          ROLLBACK_EOF
