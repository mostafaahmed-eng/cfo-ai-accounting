name: Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'cfo-backend/**'
      - 'docker-compose.test.yml'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'cfo-backend/**'

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: cfo_test
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cfo_test
  TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cfo_test
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: ci_test_secret_key_for_github_actions_only_12345
  JWT_ALGORITHM: HS256
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  OPENROUTER_API_KEY: ""
  OPENROUTER_MODEL: google/gemini-2.5-flash
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  ENCRYPTION_KEY: ci_test_encryption_key_for_ci_only!!
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_BOT_USERNAME: ""
  TELEGRAM_WEBHOOK_SECRET: ""

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cfo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cfo-backend/pyproject.toml

      - name: Install dependencies
        working-directory: cfo-backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Alembic migrations
        working-directory: cfo-backend
        run: alembic upgrade head

      - name: Run full test suite with coverage
        working-directory: cfo-backend
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: cfo-backend/coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cfo-backend/pyproject.toml

      - name: Install dependencies
        working-directory: cfo-backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff mypy

      - name: Ruff lint
        working-directory: cfo-backend
        run: ruff check app/ tests/

      - name: Ruff format check
        working-directory: cfo-backend
        run: ruff format --check app/ tests/

      - name: MyPy type check
        working-directory: cfo-backend
        run: mypy app/ --ignore-missing-imports || true
