name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python runtime dependencies
        working-directory: cfo-backend
        run: |
          # Audit the actual runtime dependency tree (the same set installed by
          # Dockerfile.prod: `pip install .` with no dev extras) in a clean venv.
          # Auditing the runner's own `pip freeze` previously checked the wrong
          # environment and produced meaningless results.
          python -m venv /tmp/auditvenv
          /tmp/auditvenv/bin/pip install --quiet --upgrade pip pip-audit
          /tmp/auditvenv/bin/pip install --quiet --no-cache-dir .
          /tmp/auditvenv/bin/pip freeze > /tmp/runtime-reqs.txt
          /tmp/auditvenv/bin/pip-audit -r /tmp/runtime-reqs.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm audit policy: fail the build on CRITICAL vulnerabilities in runtime
      # dependencies (--omit=dev) so CI never silently swallows audit failures
      # (previously `|| true`).
      #
      # Accepted exception (documented, tracked, NOT a global disable): the 7
      # HIGH-severity advisories reported for Next.js 14 / its bundled postcss
      # (GHSA-q4gf-8mx6-v5v3, GHSA-3g8h-86w9-wvmq, GHSA-ffhc-5mcf-pf4q,
      # GHSA-vfv6-92ff-j949, GHSA-gx5p-jg67-6x7h, GHSA-h64f-5h5j-jqjh, ...).
      # The only fix is a breaking major upgrade to next@16 (requires React 19),
      # which is out of scope for the current batch. These same findings are
      # still surfaced by the Trivy HIGH-severity docker-scan job below, and the
      # next upgrade is tracked separately. There is no --force upgrade applied
      # because the major bump is untested/breaking.
      - name: Audit npm runtime dependencies
        working-directory: cfo-dashboard
        run: npm audit --omit=dev --audit-level=critical

  docker-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f cfo-backend/Dockerfile.prod -t cfo-backend:scan ./cfo-backend

      - name: Run Trivy vulnerability scanner (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cfo-backend:scan'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Build frontend image
        run: docker build -f cfo-dashboard/Dockerfile.prod -t cfo-frontend:scan ./cfo-dashboard

      - name: Run Trivy vulnerability scanner (frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cfo-frontend:scan'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-backend.sarif'

      - name: Upload Trivy SARIF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: |
            trivy-backend.sarif
            trivy-frontend.sarif
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for hardcoded API keys and secrets..."
          if grep -rn "sk-or-v1" --include="*.py" --include="*.json" --include="*.env" .; then
            echo "WARNING: Found hardcoded OpenRouter API keys in source code!"
            exit 1
          fi
          if grep -rn "TELEGRAM_BOT_TOKEN=[0-9]" --include="*.py" --include="*.json" .; then
            echo "WARNING: Found hardcoded Telegram tokens in source code!"
            exit 1
          fi
          if grep -rn "changeme123" --include="*.py" --include="*.md" --include="*.sh" .; then
            echo "WARNING: Found the weak default admin password 'changeme123' in source code!"
            exit 1
          fi
          echo "No hardcoded secrets found."
