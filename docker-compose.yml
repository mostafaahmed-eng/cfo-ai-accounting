services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cfo_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cfo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./cfo-backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cfo_db
      REDIS_URL: redis://redis:6379/0
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      OPENROUTER_MODEL: google/gemini-2.5-flash
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      S3_ENDPOINT_URL: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      S3_BUCKET_NAME: cfo-documents
      S3_REGION: auto
      TELEGRAM_WEBHOOK_SECRET: ""
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cfo_manager_test
      MAX_UPLOAD_SIZE: "10485760"
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./cfo-backend:/app

  celery-worker:
    build:
      context: ./cfo-backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cfo_db
      REDIS_URL: redis://redis:6379/0
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      OPENROUTER_MODEL: google/gemini-2.5-flash
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      S3_ENDPOINT_URL: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      S3_BUCKET_NAME: cfo-documents
      S3_REGION: auto
      TELEGRAM_WEBHOOK_SECRET: ""
    command: >
      celery -A app.tasks.celery_app:celery_app worker
      --loglevel=info
      --queues=receipt-processing,ai-extraction,duplicate-detection,telegram-responses,journal-posting,report-generation,notifications
    volumes:
      - ./cfo-backend:/app

  frontend:
    build:
      context: ./cfo-dashboard
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./cfo-dashboard:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
