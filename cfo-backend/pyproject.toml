[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfo-backend"
version = "0.1.0"
description = "AI CFO Manager Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1,<5.0",
    "python-multipart>=0.0.6",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "httpx>=0.25.0",
    "boto3>=1.34.0",
    "python-magic>=0.4.27",
    "pypdf>=5.0.0",
    "Pillow>=10.0.0",
    "slowapi>=0.1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "faker>=21.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "requires_pg: test requires a running PostgreSQL instance",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "RUF059", "S110", "SIM102", "SIM117"]
